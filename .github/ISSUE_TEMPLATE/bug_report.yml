name: Bug report
description: Report a reproducible Trama problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible sequence.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Commit/version, OS, Node and browser versions.
    validations:
      required: true
