name: VPS release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trama-vps-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run check:landing
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: landing-release-qa
          path: printscreens/trama-landing/
          retention-days: 7
      - name: Release approved
        run: echo "The VPS watcher will deploy this exact main commit after this workflow succeeds."
