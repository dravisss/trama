<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ECE8DB">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232B3A2E'/%3E%3Cpath d='M10 18c2-7 10-8 13-2' fill='none' stroke='%23F7F3E7' stroke-width='2'/%3E%3Cpath d='m21 12 3 4-5 1' fill='none' stroke='%23F7F3E7' stroke-width='2'/%3E%3C/svg%3E">
  <title>LoopViewer — Mapas sistêmicos</title>
  <link rel="stylesheet" href="dist/loopviewer-ui-tokens.css">
  <link rel="stylesheet" href="src/design-system/fonts.css">
  <link rel="stylesheet" href="src/react/ui/ui.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="src/app/appShell.css">
  <link rel="stylesheet" href="src/app/storyStudio/storyStudio.css">
  <link rel="stylesheet" href="src/react/reactApp.css">
  <link rel="stylesheet" href="src/react/storyStudioV2/storyStudioV2.css">
  <link rel="stylesheet" href="src/react/applicationRoutes.css">
  <link rel="stylesheet" href="src/react/promotion.css">
  <link rel="stylesheet" href="src/react/prototypeParity.css">
</head>
<body class="redesigned-ui" data-theme="matcha" data-density="comfortable">
  <main class="app">
    <div id="react-root"></div>
    <section class="workspace-home" id="workspace-home" aria-labelledby="workspace-home-title"></section>

    <!-- The editor stage is not the first workspace surface. Keep the legacy
         canvas inert until the app has loaded the project and selected a mode;
         otherwise the old DOM flashes before React mounts the Projects view. -->
    <section class="stage" aria-label="Diagrama de loop causal interativo" hidden>
      <aside class="workspace-sidebar" id="workspace-sidebar" aria-label="Navegação do workspace">
        <div id="react-workspace-sidebar-root"></div>
      </aside>

      <div class="map-area" id="map-area">
        <div id="react-canvas-surface-root"></div>
      <div id="react-presentation-root"></div>
      </div>

      <aside class="editor-dock collapsed" id="editor-dock" aria-label="Ferramentas de edição">
        <div id="react-editor-rail-root"></div>
        <div class="dock-panel" id="dock-panel">
          <header class="dock-header">
            <div>
              <span class="dock-eyebrow">Editor local</span>
              <h2 id="dock-title">Inspector</h2>
            </div>
          </header>
          <div id="react-editor-dock-panels-root"></div>
          <div id="react-editor-inspector-root"></div>
          <div id="react-story-frame-root"></div>
        </div>
      </aside>
      <div id="react-story-timeline-shell-root"></div>
    </section>

    <div id="react-movement-composer-root"></div>
    <div id="react-overlay-root"></div>
  </main>

  <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/layout-base/layout-base.js"></script>
  <script src="https://unpkg.com/cose-base/cose-base.js"></script>
  <script src="https://unpkg.com/cytoscape-cose-bilkent@4.1.0/cytoscape-cose-bilkent.js"></script>
  <script src="dist/cld-engine.iife.js"></script>
  <script>document.documentElement.dataset.cldApi = typeof CLD.createCLD;</script>
  <script src="dist/react-app.iife.js"></script>
  <script src="dist/app.iife.js"></script>
</body>
</html>
